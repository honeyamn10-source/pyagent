name: Bug report
description: Report a bug or unexpected behaviour in pyagent
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Fill in the details below so we can reproduce and fix it quickly.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproducer
    attributes:
      label: Steps to reproduce
      description: A minimal code snippet that triggers the bug.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened? Include tracebacks if any.
  - type: input
    id: version
    attributes:
      label: pyagent version
      description: Which version are you using? Run `python -c "import pyagent; print(pyagent.__version__)"`.
    validations:
      required: true
  - type: input
    id: python_version
    attributes:
      label: Python version
      description: e.g. 3.9, 3.11, 3.13
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local
        - CI
        - Container
        - Other
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else relevant, such as the model endpoint you used.