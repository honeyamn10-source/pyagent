# Dependabot config
# https://docs.github.com/code-security/dependabot

version: 2
updates:
  # pyagent is zero-dependency, so the pip ecosystem only tracks the build
  # tooling used across the repo (setuptools, etc.).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5